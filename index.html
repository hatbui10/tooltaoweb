<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tạo Cấu Trúc CSS, Logic & Form HTML</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { 
            color: #bb86fc; 
            margin-top: 0; 
        }
        .section-title { 
            font-weight: bold; 
            color: #cfcfcf; 
            margin-bottom: 10px; 
        }
        
        .button-group { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px; 
            flex-wrap: wrap; 
        }
        .button-group button {
            padding: 10px 18px; 
            cursor: pointer; 
            border: none;
            background-color: #333; 
            color: #fff; 
            border-radius: 6px;
            transition: background 0.3s;
            font-weight: bold;
        }
        .button-group button:hover { 
            background-color: #444; 
        }

        .add-generator-btn { 
            background-color: #ffb74d !important; 
            color: #000 !important; 
        }
        .add-generator-btn:hover { 
            background-color: #ffa726 !important; 
        }

        .logic-btn {
            background-color: #03dac6 !important;
            color: #000 !important;
        }
        .logic-btn:hover {
            background-color: #018786 !important;
        }

        .form-btn {
            background-color: #cf6679 !important;
            color: #000 !important;
        }
        .form-btn:hover {
            background-color: #b00020 !important;
            color: #fff !important;
        }

        #input-container { 
            background: #2c2c2c; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border: 1px solid #444;
        }
        .form-title {
            color: #bb86fc; 
            font-weight: bold; 
            margin-bottom: 15px; 
            font-size: 16px;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .grid-inputs { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group.full-width {
            grid-column: span 2;
        }
        .input-group label { 
            margin-bottom: 5px; 
            font-size: 13px; 
            color: #bbb; 
            font-weight: 600;
        }
        .input-group input, .input-group textarea {
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box;
            background: #121212; 
            border: 1px solid #444; 
            border-radius: 6px; 
            color: #fff;
            font-size: 14px;
        }
        .input-group input:focus, .input-group textarea:focus { 
            border-color: #bb86fc; 
            outline: none; 
            box-shadow: 0 0 0 2px rgba(187, 134, 252, 0.2);
        }
        
        .action-container {
            margin-top: 20px;
            text-align: right;
        }
        .action-btn {
            padding: 10px 20px; 
            background-color: #bb86fc;
            color: #000; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background-color: #9965f4;
        }
        
        h3 {
            font-size: 15px;
            color: #cfcfcf;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%; 
            height: 180px; 
            padding: 12px; 
            box-sizing: border-box;
            background: #121212; 
            border: 1px solid #444; 
            border-radius: 6px;
            color: #03dac6; 
            font-family: Consolas, monospace; 
            font-size: 14px;
            resize: vertical;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trình Tạo Cấu Trúc CSS, Logic & Form HTML</h2>
    
    <div class="section-title">Chọn đối tượng hoặc cấu trúc cần tạo:</div>
    <div class="button-group" id="main-button-group">
        <button onclick="loadForm('div')">div (CSS)</button>
        <button onclick="loadForm('body')">body (CSS)</button>
        <button onclick="loadForm('button')">button (CSS)</button>
        <button onclick="loadForm('input')">input (CSS)</button>
    </div>

    <div class="button-group">
        <button class="add-generator-btn" onclick="loadAdvancedDivBuilder()">+ Tạo khối Div/HTML (Inline Style)</button>
        <button class="logic-btn" onclick="loadLogicBuilder('function')">function</button>
        <button class="logic-btn" onclick="loadLogicBuilder('if')">if</button>
        <button class="logic-btn" onclick="loadLogicBuilder('ifelse')">if else</button>
        <button class="form-btn" onclick="loadFormBuilder()">form html cơ bản</button>
    </div>

    <div id="input-container">
        <p style="text-align: center; color: #777; margin: 0;">Vui lòng chọn một tùy chọn ở trên để bắt đầu cấu hình.</p>
    </div>

    <h3>Kết quả:</h3>
    <textarea id="output-result" placeholder="Kết quả sẽ hiển thị ở đây sau khi bạn hoàn tất..."></textarea>
</div>

<script>
    const defaultProperties = [
        'background', 'color', 'width', 'height', 'border', 'border-radius', 
        'margin', 'margin-top', 'margin-right', 'margin-bottom', 'margin-left',
        'padding', 'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
        'font-size', 'font-weight', 'display', 'position', 'outline'
    ];

    const formConfigs = {
        'div': defaultProperties,
        'body': defaultProperties,
        'button': defaultProperties,
        'input': defaultProperties
    };

    let currentSelector = '';
    let currentMode = 'css'; 

    function getPlaceholder(field) {
        if (field.includes('background') || field.includes('color')) return 'VD: #1e1e13, red...';
        if (['width', 'height', 'margin', 'padding', 'font-size', 'border-radius'].some(k => field.includes(k))) return 'VD: 30, 100 (tự thêm px)';
        if (field.includes('border')) return 'VD: 1px solid #444';
        return 'Nhập giá trị...';
    }

    function loadForm(selector) {
        currentMode = 'css';
        currentSelector = selector;
        const container = document.getElementById('input-container');
        container.innerHTML = `<div class="form-title">Cấu hình CSS cho: &lt;${selector}&gt;</div>`;
        
        const grid = document.createElement('div');
        grid.className = 'grid-inputs';
        
        const fields = formConfigs[selector] || defaultProperties;
        fields.forEach((field, i) => {
            grid.innerHTML += `
                <div class="input-group">
                    <label>${field}:</label>
                    <input type="text" id="val_${i}" placeholder="${getPlaceholder(field)}">
                </div>
            `;
        });
        
        container.appendChild(grid);
        
        const actionDiv = document.createElement('div');
        actionDiv.className = 'action-container';
        actionDiv.innerHTML = `<button class="action-btn" onclick="generateResult()">Tạo kết quả</button>`;
        container.appendChild(actionDiv);
    }

    function loadAdvancedDivBuilder() {
        currentMode = 'div-inline';
        const container = document.getElementById('input-container');
        container.innerHTML = `
            <div class="form-title">Tạo cấu trúc Div với Style bên trong</div>
            <div class="grid-inputs">
                <div class="input-group full-width">
                    <label>Tên thẻ / Class / ID (VD: div class="bnhgv"):</label>
                    <input type="text" id="adv_element" placeholder="VD: div class='bnhgv' hoặc .bnhgv">
                </div>
                <div class="input-group">
                    <label>background:</label>
                    <input type="text" id="adv_bg" placeholder="VD: #1e1e13">
                </div>
                <div class="input-group">
                    <label>width / height:</label>
                    <input type="text" id="adv_size" placeholder="VD: 100px hoặc 100%">
                </div>
                <div class="input-group">
                    <label>margin:</label>
                    <input type="text" id="adv_margin" placeholder="VD: 10px 20px">
                </div>
                <div class="input-group">
                    <label>padding:</label>
                    <input type="text" id="adv_padding" placeholder="VD: 15px">
                </div>
                <div class="input-group full-width">
                    <label>Nội dung bên trong (HTML con nếu có):</label>
                    <textarea id="adv_content" rows="3" placeholder="VD: Nội dung hoặc để trống..."></textarea>
                </div>
            </div>
            <div class="action-container">
                <button class="action-btn" onclick="generateResult()">Tạo kết quả</button>
            </div>
        `;
    }

    function loadLogicBuilder(type) {
        currentMode = type;
        const container = document.getElementById('input-container');
        
        if (type === 'function') {
            container.innerHTML = `
                <div class="form-title">Tạo cấu trúc Function (Hàm JavaScript)</div>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label>Tên hàm:</label>
                        <input type="text" id="func_name" placeholder="VD: switchUserRole">
                    </div>
                    <div class="input-group">
                        <label>Tham số truyền vào (nếu có):</label>
                        <input type="text" id="func_params" placeholder="VD: role, status">
                    </div>
                    <div class="input-group full-width">
                        <label>Khối lệnh bên trong hàm:</label>
                        <textarea id="func_body" rows="4" placeholder="VD: console.log(role); return true;"></textarea>
                    </div>
                </div>
                <div class="action-container">
                    <button class="action-btn" onclick="generateResult()">Tạo kết quả</button>
                </div>
            `;
        } else if (type === 'if') {
            container.innerHTML = `
                <div class="form-title">Tạo cấu trúc Câu lệnh điều kiện IF</div>
                <div class="grid-inputs">
                    <div class="input-group full-width">
                        <label>Điều kiện (trong ngoặc):</label>
                        <input type="text" id="if_condition" placeholder="VD: role === 'teacher'">
                    </div>
                    <div class="input-group full-width">
                        <label>Khối lệnh khi thỏa mãn điều kiện:</label>
                        <textarea id="if_body" rows="4" placeholder="VD: alert('Chào giáo viên!');"></textarea>
                    </div>
                </div>
                <div class="action-container">
                    <button class="action-btn" onclick="generateResult()">Tạo kết quả</button>
                </div>
            `;
        } else if (type === 'ifelse') {
            container.innerHTML = `
                <div class="form-title">Tạo cấu trúc Câu lệnh IF - ELSE</div>
                <div class="grid-inputs">
                    <div class="input-group full-width">
                        <label>Điều kiện IF (trong ngoặc):</label>
                        <input type="text" id="ifelse_condition" placeholder="VD: score >= 5">
                    </div>
                    <div class="input-group full-width">
                        <label>Khối lệnh IF (khi đúng):</label>
                        <textarea id="ifelse_body" rows="3" placeholder="VD: console.log('Đạt');"></textarea>
                    </div>
                    <div class="input-group full-width">
                        <label>Khối lệnh ELSE (khi sai):</label>
                        <textarea id="ifelse_else_body" rows="3" placeholder="VD: console.log('Trượt');"></textarea>
                    </div>
                </div>
                <div class="action-container">
                    <button class="action-btn" onclick="generateResult()">Tạo kết quả</button>
                </div>
            `;
        }
    }

    function loadFormBuilder() {
        currentMode = 'html-form';
        const container = document.getElementById('input-container');
        container.innerHTML = `
            <div class="form-title">Tạo Form HTML Cơ Bản</div>
            <div class="grid-inputs">
                <div class="input-group">
                    <label>Class hoặc ID của Form (nếu có):</label>
                    <input type="text" id="form_class" placeholder="VD: class='login-form'">
                </div>
                <div class="input-group">
                    <label>Phương thức (method):</label>
                    <input type="text" id="form_method" placeholder="VD: POST hoặc GET">
                </div>
                <div class="input-group full-width">
                    <label>Đường dẫn xử lý (action):</label>
                    <input type="text" id="form_action" placeholder="VD: /submit-url hoặc #">
                </div>
                <div class="input-group full-width">
                    <label>Các trường bên trong form (mặc định sẵn đoạn code mẫu bạn yêu cầu):</label>
                    <textarea id="form_fields" rows="6"><!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tạo Cấu Trúc CSS, Logic & Form HTML</title></textarea>
                </div>
            </div>
            <div class="action-container">
                <button class="action-btn" onclick="generateResult()">Tạo kết quả</button>
            </div>
        `;
    }

    function generateResult() {
        let wrapHtmlTemplate = (contentBody) => {
            return `<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đã Tạo</title>
</head>
<body>

${contentBody}

</body>
</html>`;
        };

        let innerContent = "";

        if (currentMode === 'div-inline') {
            let rawElement = document.getElementById('adv_element').value.trim();
            if (!rawElement) {
                alert("Vui lòng nhập tên phần tử!");
                return;
            }

            const bg = document.getElementById('adv_bg').value.trim();
            const size = document.getElementById('adv_size').value.trim();
            const margin = document.getElementById('adv_margin').value.trim();
            const padding = document.getElementById('adv_padding').value.trim();
            const content = document.getElementById('adv_content').value.trim();

            let formatVal = (v) => (/^\d+(\.\d+)?$/.test(v) ? v + "px" : v);

            let styles = [];
            if (bg) styles.push(`background: ${bg}`);
            if (size) {
                styles.push(`width: ${formatVal(size)}`);
                styles.push(`height: ${formatVal(size)}`);
            }
            if (margin) styles.push(`margin: ${formatVal(margin)}`);
            if (padding) styles.push(`padding: ${formatVal(padding)}`);

            let styleAttr = styles.length > 0 ? ` style="${styles.join('; ')};"` : "";
            let htmlResult = "";

            if (rawElement.startsWith('<')) {
                htmlResult = rawElement.replace(/>/, `${styleAttr}>`);
                if (content) {
                    let matchTag = rawElement.match(/<([a-zA-Z0-9]+)/);
                    let tagName = matchTag ? matchTag[1] : 'div';
                    htmlResult += `\n    ${content}\n</${tagName}>`;
                }
            } else if (rawElement.startsWith('.') || rawElement.startsWith('#')) {
                let attrType = rawElement.startsWith('.') ? 'class' : 'id';
                let attrVal = rawElement.substring(1);
                htmlResult = `<div ${attrType}="${attrVal}"${styleAttr}>${content ? '\n    ' + content + '\n' : ''}</div>`;
            } else {
                htmlResult = `<${rawElement}${styleAttr}>${content ? '\n    ' + content + '\n' : ''}</${rawElement}>`;
            }

            innerContent = htmlResult;

        } else if (currentMode === 'function') {
            let name = document.getElementById('func_name').value.trim() || 'myFunction';
            let params = document.getElementById('func_params').value.trim();
            let body = document.getElementById('func_body').value.trim();

            let jsCode = `function ${name}(${params}) {\n`;
            if (body) {
                jsCode += body.split('\n').map(line => `    ${line}`).join('\n') + '\n';
            }
            jsCode += `}`;
            innerContent = `<script>\n${jsCode}\n<\/script>`;

        } else if (currentMode === 'if') {
            let condition = document.getElementById('if_condition').value.trim() || 'true';
            let body = document.getElementById('if_body').value.trim();

            let jsCode = `if (${condition}) {\n`;
            if (body) {
                jsCode += body.split('\n').map(line => `    ${line}`).join('\n') + '\n';
            }
            jsCode += `}`;
            innerContent = `<script>\n${jsCode}\n<\/script>`;

        } else if (currentMode === 'ifelse') {
            let condition = document.getElementById('ifelse_condition').value.trim() || 'true';
            let body = document.getElementById('ifelse_body').value.trim();
            let elseBody = document.getElementById('ifelse_else_body').value.trim();

            let jsCode = `if (${condition}) {\n`;
            if (body) {
                jsCode += body.split('\n').map(line => `    ${line}`).join('\n') + '\n';
            }
            jsCode += `} else {\n`;
            if (elseBody) {
                jsCode += elseBody.split('\n').map(line => `    ${line}`).join('\n') + '\n';
            }
            jsCode += `}`;
            innerContent = `<script>\n${jsCode}\n<\/script>`;

        } else if (currentMode === 'html-form') {
            let formAttr = document.getElementById('form_class').value.trim();
            let method = document.getElementById('form_method').value.trim();
            let action = document.getElementById('form_action').value.trim();
            let innerFields = document.getElementById('form_fields').value; // Giữ nguyên khoảng trắng, xuống dòng

            let attrs = [];
            if (formAttr) attrs.push(formAttr);
            if (method) attrs.push(`method="${method}"`);
            if (action) attrs.push(`action="${action}"`);

            let attrString = attrs.length > 0 ? " " + attrs.join(" ") : "";
            let formRes = `<form${attrString}>\n`;
            if (innerFields) {
                formRes += innerFields.split('\n').map(line => line ? `    ${line}` : '').join('\n') + '\n';
            }
            formRes += `</form>`;
            innerContent = formRes;

        } else {
            const fields = formConfigs[currentSelector] || defaultProperties;
            let cssRes = `${currentSelector} {\n`;
            
            fields.forEach((field, i) => {
                const inputElem = document.getElementById('val_' + i);
                if (inputElem) {
                    let val = inputElem.value.trim();
                    if (val !== "") {
                        const sizeProps = ['width', 'height', 'margin', 'padding', 'font-size', 'border-radius'];
                        if (/^\d+(\.\d+)?$/.test(val) && sizeProps.some(p => field.includes(p))) {
                            val += 'px';
                        }
                        cssRes += `  ${field}: ${val};\n`;
                    }
                }
            });
            
            cssRes += "}";
            innerContent = `<style>\n${cssRes}\n</style>`;
        }

        document.getElementById('output-result').value = wrapHtmlTemplate(innerContent);
    }
</script>
</body>
</html>
